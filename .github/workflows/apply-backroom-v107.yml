name: Apply Backroom v1.07 unified version

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v107-trigger.txt

permissions:
  contents: write

jobs:
  apply-verified-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact version replacements
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app.js': [('const APP_VERSION = "v1.13";', 'const APP_VERSION = "v1.07";')],
              'calendar.js': [('calendar v1.03', 'calendar v1.07')],
              'style.css': [('stylesheet v1.06', 'stylesheet v1.07')],
              'calendar.css': [('calendar — v0.86', 'calendar — v1.07')],
              'index.html': [
                  ('<title>Backroom - v1.06</title>', '<title>Backroom - v1.07</title>'),
                  ('style.css?v=1.06', 'style.css?v=1.07'),
                  ('calendar.css?v=0.90', 'calendar.css?v=1.07'),
                  ('app.js?v=1.13', 'app.js?v=1.07'),
                  ('calendar.js?v=1.03', 'calendar.js?v=1.07'),
              ],
          }

          for name, changes in replacements.items():
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              for old, new in changes:
                  count = text.count(old)
                  assert count == 1, f'{name}: expected one occurrence of {old!r}, found {count}'
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate unified public version
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check calendar.js
          python - <<'PY'
          from pathlib import Path

          files = {
              'app.js': Path('app.js').read_text(encoding='utf-8'),
              'calendar.js': Path('calendar.js').read_text(encoding='utf-8'),
              'style.css': Path('style.css').read_text(encoding='utf-8'),
              'calendar.css': Path('calendar.css').read_text(encoding='utf-8'),
              'index.html': Path('index.html').read_text(encoding='utf-8'),
          }

          required = {
              'app.js': ['const APP_VERSION = "v1.07";'],
              'calendar.js': ['calendar v1.07'],
              'style.css': ['stylesheet v1.07'],
              'calendar.css': ['calendar — v1.07'],
              'index.html': [
                  '<title>Backroom - v1.07</title>',
                  'style.css?v=1.07',
                  'calendar.css?v=1.07',
                  'app.js?v=1.07',
                  'calendar.js?v=1.07',
              ],
          }

          for name, needles in required.items():
              for needle in needles:
                  assert needle in files[name], f'{name}: {needle}'
          PY

      - name: Commit unified version to main
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .backroom-v107 .github/workflows/apply-backroom-v107.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js calendar.js style.css calendar.css index.html
          git commit -m "Unify public version numbering at v1.07"
          git push origin HEAD:main
