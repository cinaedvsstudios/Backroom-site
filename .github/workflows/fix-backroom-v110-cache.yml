name: Fix Backroom v1.10 cache references

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v110-trigger.txt

permissions:
  contents: write

jobs:
  fix-cache-references:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Update cache references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          for name in ['index.html', 'admin.html']:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\?v=1\.(?:08|09)', '?v=1.10', text)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Validate cache references
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'style.css?v=1.10' index.html
          grep -F 'calendar.css?v=1.10' index.html
          grep -F 'app.js?v=1.10' index.html
          grep -F 'calendar.js?v=1.10' index.html
          grep -F 'style.css?v=1.10' admin.html
          grep -F 'admin.js?v=1.10' admin.html
          grep -F 'admin-enhancements.js?v=1.10' admin.html
          ! grep -E '\?v=1\.(08|09)' index.html admin.html

      - name: Commit correction to main
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-backroom-v110-cache.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Align Backroom v1.10 cache references"
          git push origin HEAD:main
