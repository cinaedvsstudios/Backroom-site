name: Fix Backroom page title

on:
  push:
    paths:
      - '.github/workflows/fix-page-title.yml'

permissions:
  contents: write

jobs:
  fix-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop app.js overriding SEO title
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = "    document.title = `Backroom - ${BACKROOM_VERSION}`;\n"
          if old not in text:
              raise SystemExit('Expected document.title override not found; refusing unsafe edit.')
          path.write_text(text.replace(old, '', 1), encoding='utf-8')
          PY

      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep SEO title instead of version title"
          git push
