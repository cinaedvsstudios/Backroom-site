name: Apply Backroom v1.06 share routes

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v106-trigger.txt

permissions:
  contents: write

jobs:
  apply-verified-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact v1.06 patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in .backroom-v106/*.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done

      - name: Validate JavaScript and route features
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check calendar.js
          python - <<'PY'
          from pathlib import Path

          app = Path('app.js').read_text(encoding='utf-8')
          calendar = Path('calendar.js').read_text(encoding='utf-8')
          style = Path('style.css').read_text(encoding='utf-8')
          index = Path('index.html').read_text(encoding='utf-8')

          required_app = [
              'const APP_VERSION = "v1.13";',
              'function getSharedResultsRouteState',
              "params.set('q', query)",
              "params.set('tags', activeFilters.join(','))",
              "hash.startsWith('#calendar?')",
              'shareResultsForCurrentView'
          ]
          required_calendar = [
              'calendar v1.03',
              'function readCalendarRouteState',
              "params.set('date', state.selectedDate)",
              'function shareSelectedCalendarDay',
              "id=\"calendar-share-day\"",
              'applyCalendarRouteState()'
          ]
          required_style = ['calendar-share-day-btn', 'calendar-panel-heading']
          required_index = [
              '<title>Backroom - v1.06</title>',
              'style.css?v=1.06',
              'app.js?v=1.13',
              'calendar.js?v=1.03'
          ]

          for needle in required_app:
              assert needle in app, needle
          for needle in required_calendar:
              assert needle in calendar, needle
          for needle in required_style:
              assert needle in style, needle
          for needle in required_index:
              assert needle in index, needle
          PY

      - name: Commit verified update to main
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .backroom-v106 .github/workflows/apply-backroom-v106.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js calendar.js style.css index.html
          git commit -m "Add shareable event days and filtered search results"
          git push origin HEAD:main
