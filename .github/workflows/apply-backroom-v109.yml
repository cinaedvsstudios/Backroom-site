name: Apply Backroom v1.09 admin location and delete tools

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v109-trigger.txt

permissions:
  contents: write

jobs:
  apply-verified-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply v1.09 admin update
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          version_files = [
              'app.js', 'calendar.js', 'style.css', 'calendar.css',
              'index.html', 'admin.html', 'admin.js', 'admin-enhancements.js'
          ]

          for name in version_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'v1.08' not in text:
                  raise AssertionError(f'{name}: expected v1.08 baseline')
              path.write_text(text.replace('v1.08', 'v1.09'), encoding='utf-8')

          admin_path = Path('admin.js')
          admin = admin_path.read_text(encoding='utf-8')
          old_index = "        const actualIndex = draftData.findIndex(d => d[idField] === id);\n        const editIndex = actualIndex >= 0 ? actualIndex : rowIndex;"
          new_index = "        const actualIndex = draftData.indexOf(row);\n        const editIndex = actualIndex >= 0 ? actualIndex : rowIndex;"
          if old_index not in admin:
              raise AssertionError('admin.js: row index anchor not found')
          admin = admin.replace(old_index, new_index, 1)

          old_row = "        html += `<tr data-id=\"${id}\" class=\"${isNew ? 'new-entry-row' : ''}\" onmousedown=\"selectAdminRecord(this.dataset.id)\">`;"
          new_row = "        html += `<tr data-id=\"${id}\" data-draft-index=\"${editIndex}\" class=\"${isNew ? 'new-entry-row' : ''}\" onmousedown=\"selectAdminRecord(this.dataset.id)\">`;"
          if old_row not in admin:
              raise AssertionError('admin.js: table row anchor not found')
          admin = admin.replace(old_row, new_row, 1)
          admin_path.write_text(admin, encoding='utf-8')

          enhancement_path = Path('admin-enhancements.js')
          enhancement = enhancement_path.read_text(encoding='utf-8')
          module = Path('.backroom-v109/admin-location-delete.js').read_text(encoding='utf-8').strip()
          marker = 'Backroom Admin v1.09 location filters and safe bulk delete'
          if marker in enhancement:
              raise AssertionError('admin-enhancements.js: v1.09 module already present')
          enhancement_path.write_text(enhancement.rstrip() + '\n\n' + module + '\n', encoding='utf-8')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check calendar.js
          node --check admin.js
          node --check admin-enhancements.js

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          names = ['app.js','calendar.js','style.css','calendar.css','index.html','admin.html','admin.js','admin-enhancements.js']
          for name in names:
              text = Path(name).read_text(encoding='utf-8')
              if 'v1.08' in text:
                  raise AssertionError(f'{name}: stale v1.08 remains')
              if 'v1.09' not in text:
                  raise AssertionError(f'{name}: v1.09 missing')
          PY

      - name: Check admin row identity changes
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const actualIndex = draftData.indexOf(row);' admin.js
          grep -F 'data-draft-index="${editIndex}"' admin.js

      - name: Check admin location and delete features
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'admin-country-filter' admin-enhancements.js
          grep -F 'admin-city-filter' admin-enhancements.js
          grep -F 'btn-delete-records' admin-enhancements.js
          grep -F 'delete-mode-armed' admin-enhancements.js
          grep -F 'delete-record-selected' admin-enhancements.js
          grep -F 'You are going to delete ${count} record' admin-enhancements.js
          grep -F 'Remember to save or download the JSON again after this.' admin-enhancements.js
          grep -F 'draftData = draftData.filter((record, index) => !selectedSet.has(index));' admin-enhancements.js
          grep -F 'refreshVenueLocationMap' admin-enhancements.js
          grep -F 'dataset.draftIndex' admin-enhancements.js

      - name: Commit verified update to main
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .backroom-v109 .github/workflows/apply-backroom-v109.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js calendar.js style.css calendar.css index.html admin.html admin.js admin-enhancements.js
          git commit -m "Add admin country city filters and safe bulk delete"
          git push origin HEAD:main
