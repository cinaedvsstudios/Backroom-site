name: Apply Backroom v1.10 calendar adjacent days

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v110-trigger.txt

permissions:
  contents: write

jobs:
  apply-verified-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Apply calendar update and version bump
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          calendar_path = Path('calendar.js')
          calendar = calendar_path.read_text(encoding='utf-8')

          month_start = calendar.index('    function monthCells() {')
          month_end = calendar.index('\n    function ensureSelectedDate()', month_start)
          month_block = """    function monthCells() {
              const first = new Date(state.month.getFullYear(), state.month.getMonth(), 1);
              const startOffset = (first.getDay() + 6) % 7;
              const gridStart = new Date(first);
              gridStart.setDate(first.getDate() - startOffset);

              return Array.from({ length: 42 }, (_, index) => {
                  const date = new Date(gridStart);
                  date.setDate(gridStart.getDate() + index);
                  return date;
              });
          }
          """
          calendar = calendar[:month_start] + month_block + calendar[month_end + 1:]

          grid_start = calendar.index('        const days = monthCells().map(date => {')
          grid_end = calendar.index('        return `<div class="calendar-grid">', grid_start)
          grid_block = """        const days = monthCells().map(date => {
              const key = dateKey(date);
              const count = eventsOnDate(key).length;
              const outsideMonth = date.getMonth() !== state.month.getMonth() || date.getFullYear() !== state.month.getFullYear();
              return `<button type="button" class="calendar-day${outsideMonth ? ' outside-month' : ''}${key === state.selectedDate ? ' selected' : ''}${key === today ? ' today' : ''}${count ? ' has-events' : ''}" data-calendar-date="${key}"><span class="calendar-number">${date.getDate()}</span><span class="calendar-indicators">${count ? `<span class="calendar-dot"></span>${count > 1 ? `<span class="calendar-count">${count}</span>` : ''}` : ''}</span></button>`;
          }).join('');
          """
          calendar = calendar[:grid_start] + grid_block + calendar[grid_end:]

          click_start = calendar.index("        document.querySelectorAll('[data-calendar-date]')")
          click_end = calendar.index("        document.querySelectorAll('[data-calendar-save]')", click_start)
          click_block = """        document.querySelectorAll('[data-calendar-date]').forEach(button => button.addEventListener('click', () => {
              state.dateFilter = 'all';
              const selected = parseDate(button.dataset.calendarDate);
              if (!selected) return;
              state.selectedDate = dateKey(selected);
              state.month = new Date(selected.getFullYear(), selected.getMonth(), 1);
              render();
          }));
          """
          calendar = calendar[:click_start] + click_block + calendar[click_end:]
          calendar_path.write_text(calendar, encoding='utf-8')

          css_path = Path('calendar.css')
          css = css_path.read_text(encoding='utf-8')
          css_start = css.index('.calendar-day.blank {')
          css_end = css.index('.calendar-indicators {', css_start)
          css_block = """.calendar-day.blank { background: transparent; cursor: default; }
          .calendar-day.outside-month {
              background: #151a26;
              color: #778195;
              border-color: rgba(44, 168, 212, .12);
          }
          .calendar-day.outside-month .calendar-dot,
          .calendar-day.outside-month .calendar-count { opacity: .72; }
          .calendar-day:hover:not(.blank) { border-color: var(--primary-blue); }
          .calendar-day.outside-month:hover { background: #1b2434; color: #d7deea; }
          .calendar-day.today { border-color: var(--bright-red-orange); }
          .calendar-day.selected { background: var(--primary-blue); border-color: var(--primary-blue); font-weight: bold; }
          .calendar-day.outside-month.selected { color: #fff; }
          """
          css = css[:css_start] + css_block + css[css_end:]
          css_path.write_text(css, encoding='utf-8')

          files = [
              'app.js', 'calendar.js', 'style.css', 'calendar.css',
              'index.html', 'admin.html', 'admin.js', 'admin-enhancements.js'
          ]
          for name in files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              if 'v1.09' not in text:
                  raise AssertionError(f'{name}: expected v1.09 baseline')
              path.write_text(text.replace('v1.09', 'v1.10'), encoding='utf-8')
          PY

      - name: Validate update
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check calendar.js
          node --check admin.js
          node --check admin-enhancements.js
          grep -F 'Array.from({ length: 42 }' calendar.js
          grep -F "outsideMonth ? ' outside-month'" calendar.js
          grep -F 'state.month = new Date(selected.getFullYear(), selected.getMonth(), 1);' calendar.js
          grep -F '.calendar-day.outside-month {' calendar.css
          grep -F '.calendar-day.outside-month:hover' calendar.css
          python - <<'PY'
          from pathlib import Path
          files = ['app.js','calendar.js','style.css','calendar.css','index.html','admin.html','admin.js','admin-enhancements.js']
          for name in files:
              text = Path(name).read_text(encoding='utf-8')
              assert 'v1.09' not in text, f'{name}: stale v1.09 remains'
              assert 'v1.10' in text, f'{name}: v1.10 missing'
          PY

      - name: Commit verified update to main
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .backroom-v110 .github/workflows/apply-backroom-v110.yml backroom-v110-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js calendar.js style.css calendar.css index.html admin.html admin.js admin-enhancements.js
          git commit -m "Show clickable adjacent-month days in calendar"
          git push origin HEAD:main
