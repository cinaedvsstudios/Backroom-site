name: Prepare Part 5 source packets for 55 half-complete locations
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-part5-55-source-packets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/prepare_part5_55_source_packets.py
            git add research/cruising/part5/review55/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Research preparation: retain 55 full source packets in 11 groups"
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
