name: Apply Backroom v1.05 location updates

on:
  pull_request:
    branches: [main]
    paths:
      - backroom-v105-trigger.txt

permissions:
  contents: write

jobs:
  apply-tested-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Validate staged patch
        id: validate
        continue-on-error: true
        shell: bash
        run: |
          set -u
          LC_ALL=C cat backroom-v105-patch/*.diff > /tmp/backroom-v105.patch
          sha256sum /tmp/backroom-v105.patch > /tmp/backroom-v105-sha256.txt
          git apply --check --verbose /tmp/backroom-v105.patch > /tmp/backroom-v105-check.log 2>&1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backroom-v105-patch-diagnostics
          path: |
            /tmp/backroom-v105.patch
            /tmp/backroom-v105-sha256.txt
            /tmp/backroom-v105-check.log
          if-no-files-found: error

      - name: Stop when patch validation fails
        if: steps.validate.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Apply tested v1.04 and v1.05 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/backroom-v105.patch
          node --check app.js
          node --check calendar.js
          git rm -r backroom-v105-patch .github/workflows/apply-backroom-v105.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js calendar.js index.html style.css
          git commit -m "Apply v1.04 shared location links and v1.05 German aliases"
          git push origin HEAD:main
