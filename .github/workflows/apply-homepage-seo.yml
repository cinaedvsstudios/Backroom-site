name: Apply Backroom homepage SEO

on:
  push:
    paths:
      - '.github/workflows/apply-homepage-seo.yml'

permissions:
  contents: write

jobs:
  apply-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update homepage metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = '    <title>Backroom - v1.10</title>'
          next_marker = '    <link rel="preconnect" href="https://fonts.googleapis.com">'

          if start_marker not in text:
              raise SystemExit('Expected current Backroom title was not found; index.html was not changed.')
          if next_marker not in text:
              raise SystemExit('Expected font preconnect marker was not found; index.html was not changed.')

          new_lines = [
              '    <title>Backroom | Gay Nightlife, Cruising & Events Guide</title>',
              '',
              '    <meta name="description" content="Backroom is a gay nightlife guide for finding gay bars, clubs, saunas, cruising venues, darkrooms and events across Europe.">',
              '    <meta name="keywords" content="gay nightlife guide, gay bars, gay clubs, gay saunas, cruising venues, darkrooms, fetish venues, gay events, Europe gay travel">',
              '    <meta name="robots" content="index, follow, max-image-preview:large">',
              '    <meta name="application-name" content="Backroom">',
              '    <meta name="author" content="Cinaedvs Studios">',
              '    <meta name="theme-color" content="#000000">',
              '',
              '    <link rel="canonical" href="https://cinaedvsstudios.github.io/Backroom-site/">',
              '    <link rel="sitemap" type="application/xml" title="Sitemap" href="sitemap.xml">',
              '',
              '    <meta property="og:type" content="website">',
              '    <meta property="og:site_name" content="Backroom">',
              '    <meta property="og:title" content="Backroom | Gay Nightlife, Cruising & Events Guide">',
              '    <meta property="og:description" content="Find gay bars, clubs, saunas, cruising venues, darkrooms and events across Europe with Backroom.">',
              '    <meta property="og:url" content="https://cinaedvsstudios.github.io/Backroom-site/">',
              '    <meta property="og:image" content="https://cinaedvsstudios.github.io/Backroom-site/backdoorlogo.png">',
              '    <meta property="og:image:alt" content="Backroom gay nightlife guide">',
              '',
              '    <meta name="twitter:card" content="summary">',
              '    <meta name="twitter:title" content="Backroom | Gay Nightlife, Cruising & Events Guide">',
              '    <meta name="twitter:description" content="Find gay bars, clubs, saunas, cruising venues, darkrooms and events across Europe with Backroom.">',
              '    <meta name="twitter:image" content="https://cinaedvsstudios.github.io/Backroom-site/backdoorlogo.png">',
              '',
              '    <script type="application/ld+json">',
              '    {',
              '      "@context": "https://schema.org",',
              '      "@type": "WebSite",',
              '      "name": "Backroom",',
              '      "alternateName": "Backroom Gay Nightlife Guide",',
              '      "url": "https://cinaedvsstudios.github.io/Backroom-site/",',
              '      "description": "A gay nightlife guide for finding gay bars, clubs, saunas, cruising venues, darkrooms and events across Europe.",',
              '      "inLanguage": "en",',
              '      "sameAs": [',
              '        "https://www.instagram.com/the.backroom.guide/"',
              '      ]',
              '    }',
              '    </script>',
              ''
          ]
          new_block = '\n'.join(new_lines) + '\n'
          start = text.index(start_marker)
          end = text.index(next_marker)
          path.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          PY

      - name: Commit SEO metadata
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve Backroom homepage SEO metadata"
          git push
